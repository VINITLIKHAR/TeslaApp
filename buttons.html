<!DOCTYPE html>
<html>
<head>
    <title>Button Content Example</title>
    <style>
        .content {
            display: none;
        }
    </style>
</head>
<body>
    <button id="button1" onclick="showContent(1)">Button 1</button>
    <button id="button2" onclick="showContent(2)">Button 2</button>

    <div id="content1" class="content">Content for Button 1</div>
    <div id="content2" class="content">Content for Button 2</div>

    <script>
        function showContent(buttonId) {
            // Hide all content divs
            var contentDivs = document.getElementsByClassName('content');
            for (var i = 0; i < contentDivs.length; i++) {
                contentDivs[i].style.display = 'none';
            }

            // Show the selected content div
            var selectedContentDiv = document.getElementById('content' + buttonId);
            selectedContentDiv.style.display = 'block';
        }
    </script>
</body>
</html>
